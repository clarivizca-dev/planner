name: Sync calendar
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring-ical-events
      - run: python sync_calendar.py
        env:
          CALENDAR_URLS: ${{ secrets.CALENDAR_URLS }}
      - run: |
          git config user.name "planner-bot"
          git config user.email "planner-bot@users.noreply.github.com"
          git add calendar-feed.json
          git diff --staged --quiet || (git commit -m "Update calendar" && git push)
